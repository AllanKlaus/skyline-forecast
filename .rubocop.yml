plugins:
  - rubocop-rails

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "db/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - ".gems/**/*"
    - "node_modules/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "config/**/*"

Metrics/MethodLength:
  Max: 40

Metrics/AbcSize:
  Max: 25

Metrics/CyclomaticComplexity:
  Max: 7

Metrics/ClassLength:
  Max: 150

Rails/I18nLocaleTexts:
  Enabled: false
