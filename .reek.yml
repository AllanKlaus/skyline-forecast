exclude_paths:
  - vendor
  - db
  - bin
  - spec
  - config
  - test

detectors:
  IrresponsibleModule:
    enabled: false
  UncommunicativeModuleName:
    accept:
      - "/V\\d+/"
  TooManyStatements:
    exclude:
      - "Clients::WeatherClient#forecast"
      - "Clients::WeatherClient#extended_forecast"
  FeatureEnvy:
    exclude:
      - "Clients::WeatherClient#extended_forecast"
  LongParameterList:
    exclude:
      - "Clients::WeatherClient#extended_forecast"
