services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/0
      GEOCODING_USER_AGENT: weather-forecast-api/1.0
    depends_on:
      - redis
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  bundle_cache:
